# Modeling configuration.
random_seed: 42

temporal_split:
  # Fractions of the labeled train set ordered by TransactionDT.
  train_frac: 0.70
  validation_frac: 0.15
  # Remaining ~0.15 is the labeled hold-out (most recent period).
  reference_date: "2017-11-30"  # TransactionDT is seconds from this reference.

models:
  logistic_regression:
    type: sklearn.LogisticRegression
    params:
      max_iter: 2000
      class_weight: balanced
      C: 1.0
  xgboost:
    type: xgboost.XGBClassifier
    params:
      n_estimators: 1000
      max_depth: 6
      learning_rate: 0.02
      subsample: 0.8
      colsample_bytree: 0.4
      scale_pos_weight: auto   # resolved from train positive rate at fit time
      eval_metric: logloss
      n_jobs: -1

class_imbalance:
  strategy: class_weight   # candidate-only; baseline uses balanced class_weight
  note: "No random oversampling (would leak). Compare weighting vs no weighting."
