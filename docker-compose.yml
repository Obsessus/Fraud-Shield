services:
  api:
    build: .
    image: fraud-intel-api:latest
    ports:
      - "8000:8000"
    # Mount host data so the running container uses the local artifacts/models.
    # (The image also bakes data/artifacts at build time for standalone runs.)
    volumes:
      - ./data:/app/data:ro
    environment:
      - FIP_DATA_DIR=/app/data
    restart: unless-stopped
    # Read-only root filesystem except the mounted data dir; no new privileges.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g
