name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[base,ml,serving,mlops,dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest -q -W ignore::UserWarning

  docker:
    name: Build image + boot smoke test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Build inference image
        run: docker build -t fraud-intel-api:ci .

      - name: Boot smoke test
        run: |
          docker run -d --name api -p 8000:8000 fraud-intel-api:ci
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/health || true)
            if [ -n "$code" ]; then echo "GET /health -> HTTP $code"; break; fi
            sleep 2
          done
          if [ -z "$code" ]; then echo "service did not start"; docker logs api; exit 1; fi
          docker rm -f api
