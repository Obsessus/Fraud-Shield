[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-intel"
version = "0.1.0"
description = "Fraud Intelligence Platform — IEEE-CIS fraud detection, from raw data to monitored production service."
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Base deps required from data ingestion onward (kept lean for the discovery stage).
dependencies = [
    "pandas>=2.1,<4.0",
    "numpy>=1.26,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# Installed only when their stage begins. See docs/dependency-strategy.
ml = [
    "scikit-learn>=1.4,<2.0",
    "xgboost>=2.0,<4.0",
]
serving = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "pydantic>=2.6,<3.0",
    "prometheus-client>=0.20,<1.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
    "pyarrow>=14.0,<20.0",
]
mlops = [
    "mlflow>=2.12,<4.0",
    "dvc>=3.50",
    "evidently>=0.4.30,<0.6",
    "prometheus-client>=0.20,<1.0",
    "prometheus-fastapi-instrumentator>=7.0,<8.0",
]
dev = [
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<3.0",
    "pytest>=8.2,<10.0",
    "pytest-cov>=5.0,<8.0",
    "httpx>=0.27,<1.0",
    "types-pyyaml>=6.0",
    "types-requests>=2.32",
    "kaggle>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI dependency injection uses function calls in args

[tool.ruff.lint.per-file-ignores]
# Embedded single-page UI (HTML/CSS/JS as a Python string) — long lines are fine here.
"src/fraudintel/serving/ui.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", ".venv/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.uv]
package = false
